spring:
  application:
    name: kardexis-api

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/kardexis}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false


